# =============================================================================
# ServiceWatch Configuration
# =============================================================================
# IMPORTANT: Copy this file to application.properties and fill in real values.
# Never commit application.properties with real credentials to version control.
# =============================================================================

# ── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# ── JSP View Resolver ────────────────────────────────────────────────────────
# Tells Spring MVC where to find JSP files
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ── MongoDB ──────────────────────────────────────────────────────────────────
# MongoDB Connection (configured via MONGODB_URI environment variable)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/servicewatch}

# ── Spring Mail (SMTP) ───────────────────────────────────────────────────────
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ── Application Settings ─────────────────────────────────────────────────────
app.base-url=${APP_BASE_URL:http://localhost:8080}

# First admin auto-created on first startup if no users exist
app.first-admin.email=${FIRST_ADMIN_EMAIL:admin@servicewatch.local}
app.first-admin.password=${FIRST_ADMIN_PASSWORD:Admin@12345}
app.first-admin.username=${FIRST_ADMIN_USERNAME:admin}

# ── Security ─────────────────────────────────────────────────────────────────
# Session timeout (30 minutes)
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=none

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.servicewatch=INFO
logging.level.org.springframework.security=WARN
# Never log passwords or tokens — this is enforced in the code

# ── Error Handling ────────────────────────────────────────────────────────────
# Disable the default Spring whitelabel error page (we use custom error JSPs)
server.error.whitelabel.enabled=false
server.error.path=/error

# ── Multipart (file upload limit) ────────────────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ── Monitoring Scheduler ─────────────────────────────────────────────────────
# Maximum concurrent monitoring threads (bounded pool)
monitoring.thread-pool-size=10
# Default check interval in seconds
monitoring.default-interval-seconds=60
# Default timeout in seconds
monitoring.default-timeout-seconds=10
